    <circle cx="224" cy="282" r="12" fill="#33C6EC" />
    
    <path d="M 202.1 291.8 A 24 6.5 -24 0 0 245.9 272.2" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
