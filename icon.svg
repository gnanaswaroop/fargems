<svg xmlns="http://www.w3.org/2000/svg" viewBox="122 134 249 249" width="512" height="512" role="img" aria-label="FarGems Logo">
  <defs>
    <!-- Cut-outs: where the planet, moon, reticle and flight path sit, the diamond lines are removed.
         Using a mask instead of a painted background keeps the logo transparent on any page colour. -->
    <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect x="0" y="0" width="512" height="512" fill="#FFFFFF"/>
      <circle cx="224" cy="282" r="16" fill="#000000"/>
      <circle cx="315" cy="307" r="20" fill="#000000"/>
      <circle cx="324" cy="182" r="27" fill="#000000"/>
      <path d="M 178 286 C 154 304, 174 334, 224 316 C 242 309, 254 298, 265 289" fill="none" stroke="#000000" stroke-width="11" stroke-linecap="round"/>
    </mask>
  </defs>

  
  <g id="diamond-cyan" mask="url(#cut)" fill="none" stroke="#33C6EC" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
    
    <polygon points="216,166 296,166 336,184 374,232 256,370 138,232 176,184" />

    
    <polyline points="138,232 168,244 206,256 256,256" />
    <line x1="176" y1="184" x2="168" y2="244" />
    <line x1="176" y1="184" x2="198" y2="198" />
    <line x1="198" y1="198" x2="256" y2="206" />
    <line x1="198" y1="198" x2="220" y2="228" />
    <line x1="168" y1="244" x2="220" y2="228" />
    <line x1="220" y1="228" x2="206" y2="256" />
    <line x1="220" y1="228" x2="256" y2="256" />

    
    <polyline points="374,232 344,244 292,228 256,256" />
    <line x1="336" y1="184" x2="344" y2="244" />
    <line x1="336" y1="184" x2="314" y2="198" />
    <line x1="314" y1="198" x2="292" y2="228" />

    
    <line x1="168" y1="244" x2="256" y2="370" />
    <line x1="206" y1="256" x2="256" y2="370" />
    <line x1="256" y1="256" x2="256" y2="370" />
    <line x1="344" y1="244" x2="256" y2="370" />
  </g>

  
  <g id="diamond-gold" mask="url(#cut)" fill="none" stroke="#F5BC38" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
