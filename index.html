<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>FarGems: what is above you</title>
  <meta name="description" content="Live aircraft, satellites, Sun, Moon, planets, bright stars and meteor showers above you.">
  <meta name="theme-color" content="#0b1020">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/satellite.js@5.0.0/dist/satellite.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.19/astronomy.browser.min.js"></script>
</head>
<body>
  <header class="top">
    <h1>FarGems</h1>
    <p id="status" class="muted">Finding your location…</p>
  </header>

  <form id="manual" class="manual" hidden>
    <p>Location unavailable. Enter coordinates manually:</p>
    <label>Latitude <input id="mLat" type="number" step="any" min="-90" max="90" required></label>
    <label>Longitude <input id="mLon" type="number" step="any" min="-180" max="180" required></label>
    <button type="submit">Use these</button>
  </form>

  <main>
    <section class="sky" aria-label="Sky view">
      <canvas id="dome" width="600" height="600"></canvas>
      <div class="dome-controls">
        <button id="compassBtn" type="button" hidden>Enable compass</button>
        <span id="headingLabel" class="muted">Heading: drag the dome to rotate</span>
      </div>
      <div id="weather" class="muted small"></div>
    </section>

    <section class="list" aria-label="Objects">
      <nav class="filters" role="tablist">
        <button data-tab="aircraft" class="active" type="button">Aircraft</button>
        <button data-tab="satellites" type="button">Satellites</button>
        <button data-tab="bodies" type="button">Sun, Moon, planets</button>
        <button data-tab="stars" type="button">Stars</button>
        <button data-tab="showers" type="button">Meteor showers</button>
      </nav>
      <ul id="items"></ul>
    </section>
  </main>

  <footer class="muted small">
    Data: adsb.lol, airplanes.live, OpenSky, CelesTrak, Open-Meteo. Calculations run in your browser.
    Compass is approximate (often 5–20° off).
  </footer>

  <script src="lib/core.js"></script>
  <script src="app.js" defer></script>
</body>
</html>
