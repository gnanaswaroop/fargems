# Runs the app in Safari's engine (WebKit) on every pull request and push to main, with an iPhone profile and with every
# iPad profile (six models, portrait and landscape: size, touch, iPad user agent), and in Chrome's engine with an Android
# tablet profile (e2e/ios/android-tablet.e2e.js).
# It is not a real iPhone or iPad (no real compass), so the test adds the motion permission and compass heading the
# way Safari on iOS provides them. See e2e/ios/safari.e2e.js for what it covers and what it cannot.
name: iOS Safari (WebKit)

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # The browser tests run as parallel jobs (see e2e/ios/shard.js), so the answer comes back in the time of the slowest one:
  # the Safari (WebKit) tests in five shards, and the Android tablet tests (Chromium) in a job of their own. Each job installs
  # only the browser it uses, and keeps the downloaded browsers between runs. The job called "safari" at the end is the one
  # result to look at (and to require).
  shard:
    name: shard ${{ matrix.id }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: 'webkit 1/5', browser: webkit, file: e2e/ios/safari.e2e.js, shard: '1/5' }
          - { id: 'webkit 2/5', browser: webkit, file: e2e/ios/safari.e2e.js, shard: '2/5' }
          - { id: 'webkit 3/5', browser: webkit, file: e2e/ios/safari.e2e.js, shard: '3/5' }
          - { id: 'webkit 4/5', browser: webkit, file: e2e/ios/safari.e2e.js, shard: '4/5' }
          - { id: 'webkit 5/5', browser: webkit, file: e2e/ios/safari.e2e.js, shard: '5/5' }
          - { id: 'chromium tablet', browser: chromium, file: e2e/ios/android-tablet.e2e.js, shard: '1/1' }
    env:
      FG_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Keep the downloaded browser between runs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ matrix.browser }}-${{ hashFiles('e2e/ios/package-lock.json') }}
      - name: Install the test browser
        working-directory: e2e/ios
        # The system packages come from a mirror that now and then stalls for ten minutes, so give apt short timeouts and
        # retries, and give each attempt of the install a time limit instead of letting one attempt hang the job.
        timeout-minutes: 8
        run: |
          echo 'Acquire::http::Timeout "20"; Acquire::https::Timeout "20"; Acquire::Retries "3";' | sudo tee /etc/apt/apt.conf.d/99ci-timeouts > /dev/null
          npm ci
          for attempt in 1 2 3; do
            if timeout 150 npx playwright install --with-deps ${{ matrix.browser }}; then exit 0; fi
            echo "install attempt $attempt did not finish, trying again"; sudo pkill -x apt-get || true; sudo pkill -x dpkg || true; sleep 3
          done
          exit 1
      - name: Run the browser tests
        run: node --test --test-reporter=spec ${{ matrix.file }}

  safari:
    name: safari
    needs: shard
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Every shard passed
        run: |
          echo "shards: ${{ needs.shard.result }}"
          test "${{ needs.shard.result }}" = "success"
