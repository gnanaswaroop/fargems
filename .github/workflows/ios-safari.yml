# Runs the app in Safari's engine (WebKit) on every pull request and push to main, with an iPhone profile and with every
# iPad profile (six models, portrait and landscape: size, touch, iPad user agent), and in Chrome's engine with an Android
# tablet profile (e2e/ios/android-tablet.e2e.js).
# It is not a real iPhone or iPad (no real compass), so the test adds the motion permission and compass heading the
# way Safari on iOS provides them. See e2e/ios/safari.e2e.js for what it covers and what it cannot.
name: iOS Safari (WebKit)

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  safari:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install the test browser
        working-directory: e2e/ios
        run: |
          npm ci
          npx playwright install --with-deps webkit chromium
      - name: Run the iPhone and iPad Safari tests
        run: node --test --test-reporter=spec e2e/ios/safari.e2e.js e2e/ios/android-tablet.e2e.js
