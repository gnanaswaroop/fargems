# Checks the real data feeds the app depends on, at several places in the world: aircraft (through the proxy),
# sunrise and sunset, the Moon, weather, and the ISS. It runs every day and on demand.
# It is separate from CI on purpose: public feeds change by the minute and sometimes go down, so a bad day for a
# feed must never block a pull request. A failed run is the signal to look. A feed that is simply down is skipped.
name: Live data

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Check the live feeds
        env:
          # The same repository variable the site is built with. Without it the aircraft checks are skipped.
          AIRCRAFT_PROXY_URL: ${{ vars.AIRCRAFT_PROXY_URL }}
        run: npm run test:live
