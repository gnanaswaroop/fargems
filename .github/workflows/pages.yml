# Publishes the site to GitHub Pages after every push to main, but only if the tests pass.
# Requires Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site (only what the browser needs)
        env:
          # Aircraft proxy base URL (a repository variable, not in git).
          AIRCRAFT_PROXY_URL: ${{ vars.AIRCRAFT_PROXY_URL }}
          # Optional custom domain, set in Settings > Secrets and variables > Actions > Variables.
          # It stays out of the repository. Leave the variable unset to publish on the default address.
          PAGES_DOMAIN: ${{ vars.PAGES_DOMAIN }}
        run: |
          mkdir -p _site
          cp -r index.html about.html viewer.html settings.html settings.js config.js landing.js app.js ar-view.js sw.js style.css manifest.webmanifest \
            icon.svg icon-192.png icon-512.png apple-touch-icon.png .nojekyll lib _site/
          printf '%s\n' "window.FARGEMS_CONFIG = { aircraftProxy: \"$AIRCRAFT_PROXY_URL\" };" > _site/config.js
          if [ -n "$PAGES_DOMAIN" ]; then echo "$PAGES_DOMAIN" > _site/CNAME; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
