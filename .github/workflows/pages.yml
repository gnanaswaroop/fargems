# Publishes the site to GitHub Pages after every push to main, but only if the tests pass.
# Requires Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Assemble the site (only what the browser needs)
        env:
          # Aircraft proxy base URL (a repository variable, not in git).
          AIRCRAFT_PROXY_URL: ${{ vars.AIRCRAFT_PROXY_URL }}
          # Optional custom domain, set in Settings > Secrets and variables > Actions > Variables.
          # It stays out of the repository. Leave the variable unset to publish on the default address.
          PAGES_DOMAIN: ${{ vars.PAGES_DOMAIN }}
        run: |
          mkdir -p _site
          cp -r index.html about.html 404.html viewer.html settings.html settings.js config.js landing.js app.js ar-view.js update.js nav.js sw.js style.css manifest.webmanifest \
            icon.svg logo-animated.svg icon-192.png icon-512.png icon-maskable-512.png apple-touch-icon.png favicon.ico og-image.png .nojekyll lib assets splash _site/
          # The commit this site is built from: pages compare it with version.json to notice that a newer version is live.
          printf '%s\n' "window.FARGEMS_CONFIG = { aircraftProxy: \"$AIRCRAFT_PROXY_URL\", build: \"$GITHUB_SHA\" };" > _site/config.js
          printf '{"build":"%s"}\n' "$GITHUB_SHA" > _site/version.json
          if [ -n "$PAGES_DOMAIN" ]; then echo "$PAGES_DOMAIN" > _site/CNAME; fi
          # Fill in the address for search engines (canonical links, sitemap) without keeping it in git.
          node scripts/seo.js _site "$PAGES_DOMAIN"
          # Put the build in the address of every script and stylesheet, so a CDN that keeps old copies cannot serve them
          # to a page from this build (otherwise the "new version available" bar can stay on after a reload).
          node scripts/stamp.js _site "$GITHUB_SHA"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Only this job may publish: the test and build jobs run with read-only tokens.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
