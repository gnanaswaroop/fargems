<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FarGems — sky view</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Live sky view of aircraft, satellites, planets, the Moon and meteor showers above your location. Client-side only.">
<meta name="theme-color" content="#070b14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FarGems">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body class="viewer">
<!-- Sky view: the radar and the selected object. Settings live on settings.html. -->
<header>
  <div class="brand"><img class="logo logo-sm" src="icon.svg" alt="FarGems logo" width="34" height="34">Far<b>Gems</b></div>
  <a class="pill" href="settings.html">Settings</a>
</header>

<main>
  <section class="skywrap">
    <canvas id="sky" aria-label="Radar view of objects above you"></canvas>
    <div class="zoombar" role="group" aria-label="Zoom the radar">
      <button id="zoomIn" class="btn" type="button" aria-label="Zoom in">＋</button>
      <button id="zoomOut" class="btn" type="button" aria-label="Zoom out">−</button>
      <button id="zoomReset" class="btn" type="button">Reset view</button>
    </div>
    <div id="hud" class="hud"></div>
  </section>

  <div id="status" class="status" aria-live="polite"></div>

  <section id="noLocation" class="card" hidden>
    <p>Set your location to see what is overhead.</p>
    <a class="btn primary wide" href="settings.html">Set location</a>
  </section>

  <div id="detail" class="card detail" aria-live="polite"></div>
  <div id="passes" class="card" hidden></div>

  <footer class="muted small">
    Aircraft: adsb.lol / airplanes.live / OpenSky · Satellites: CelesTrak · Sky maths: satellite.js, astronomy-engine · Clouds: Open-Meteo.
  </footer>
</main>

<div id="toast" class="toast" role="status" hidden></div>
<noscript><p style="padding:1rem">FarGems needs JavaScript.</p></noscript>

<script src="https://cdn.jsdelivr.net/npm/satellite.js@5.0.0/dist/satellite.min.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.19/astronomy.browser.min.js" crossorigin="anonymous"></script>
<script src="config.js"></script>
<script src="lib/logic.js"></script>
<script src="lib/onboarding.js"></script>
<script src="app.js"></script>
</body>
</html>
